# Component name|Purpose|Tracked path prefixes
#
# Paths are relative to the repository root and separated by spaces. Keep them
# narrow: this repository lives beside private application data in ~/.config.
alacritty|Alacritty terminal configuration|alacritty profiles/arch/alacritty
autostart|Portable desktop autostart entries|autostart
bash|Portable interactive Bash settings|bash
browsers|Portable Chromium and Brave flags|brave-flags.conf chromium-flags.conf profiles/arch/brave-flags.conf profiles/arch/chromium-flags.conf
btop|btop configuration and Arch theme|btop profiles/arch/btop
fcitx5|Fcitx input-method configuration|fcitx5
ghostty|Ghostty terminal configuration|ghostty profiles/arch/ghostty
git|Portable Git configuration|git
herdr|Herdr configuration|herdr
hypr|Hyprland and standalone idle/lock configuration|hypr profiles/arch/hypr
kitty|Kitty terminal configuration|kitty profiles/arch/kitty
mimeapps|Default application associations|mimeapps.list
mise|Mise configuration|mise
neovim|Neovim configuration and standalone theme|nvim profiles/arch/nvim
omarchy|Omarchy shell, menu, and agent settings|omarchy/defaults omarchy/extensions omarchy/shell.json
starship|Starship prompt configuration|starship.toml
system|Reviewed, manually applied system configuration|system
tmux|Tmux configuration|tmux
waybar|Standalone Arch Waybar configuration|profiles/arch/waybar
wireplumber|WirePlumber Bluetooth audio configuration|wireplumber
xterm|XTerm resources|xterm
yazi|Yazi file-manager configuration|yazi
